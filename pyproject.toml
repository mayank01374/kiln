[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiln-data"
version = "0.1.0"
description = "Self-verifying agentic compiler for heterogeneous data ingestion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mayank Singh"}]
dependencies = [
  "pydantic>=2.9,<3",
  "polars>=1.20,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
kiln = "kiln.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

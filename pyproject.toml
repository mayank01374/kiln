[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-data"
version = "1.0.0"
description = "Self-verifying agentic compiler for heterogeneous data ingestion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mayank Singh"}]
dependencies = [
  "pydantic>=2.9,<3",
  "polars>=1.20,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=0.2,<2",
  "openpyxl>=3.1,<4",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
  "ruff>=0.8,<1",
  "pytest-cov>=5,<8",
]

[project.scripts]
kiln = "kiln.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
